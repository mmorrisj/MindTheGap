[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mindthegap"
version = "0.1.0"
description = "Find critical-but-fragile open-source dependencies and coordinate who steps in."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "pydantic-settings>=2.2",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8"]

[project.scripts]
mindthegap = "mindthegap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mindthegap"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
